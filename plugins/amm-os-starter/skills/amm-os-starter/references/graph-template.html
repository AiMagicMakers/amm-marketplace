<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain map</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #d9d6cc;
    --edge: rgba(60,60,50,.28); --edge-hi: rgba(30,30,25,.75); --warn: #c0392b; --accent: #2f5d8a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1c1f25; --ink: #ecebe6; --muted: #9a9a93; --line: #2c3038;
      --edge: rgba(220,220,210,.22); --edge-hi: rgba(240,240,230,.8); --warn: #ff7b6b; --accent: #7fb0e0;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  #stage { position: relative; min-height: 320px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
         padding: 6px 10px; font-size: 12px; display: none; max-width: 260px; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .chip.warn { border-color: var(--warn); color: var(--warn); }
  input[type=search] { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  .legend label { display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: pointer; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
  .key { font-size: 12px; color: var(--muted); }
  .key span { display: inline-block; margin-right: 12px; }
  .ring { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -2px; margin-right: 4px; }
  button.note { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 4px 6px; border-radius: 6px; color: var(--accent); font: inherit; cursor: pointer; }
  button.note:hover, button.note:focus { background: var(--bg); outline: none; }
  button.note small { color: var(--muted); }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  #info p { margin: 4px 0; }
  .muted { color: var(--muted); }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <div id="stage"><canvas id="cv" aria-label="Graph of the notes of the Second Brain"></canvas><div id="tip"></div></div>
  <aside>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div class="chips" id="stats"></div>
    <h2>Search</h2>
    <input type="search" id="q" placeholder="A note, a word from the title...">
    <p style="margin:8px 0 0"><button class="note" type="button" id="recenter" style="display:inline;width:auto">Recenter the map</button></p>
    <h2>Folders</h2>
    <div class="legend" id="legend"></div>
    <p class="key" style="margin-top:10px">
      <span><i class="ring" style="border:3px solid var(--warn)"></i>to complete</span>
      <span><i class="ring" style="border:2px dashed var(--muted)"></i>no link</span>
    </p>
    <h2>Selected note</h2>
    <div id="info"><p class="muted">Click a point to see the note and its links.</p></div>
    <h2>Worth a look</h2>
    <div id="watch"></div>
    <details><summary>All notes</summary><div id="all"></div></details>
  </aside>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var PALETTE = ['#2f6db5', '#d9822b', '#3a9d6f', '#b0527a', '#7a6bc4', '#c2a12a', '#2b9aa8', '#8a6d55', '#d1523f'];
  var folders = []; D.nodes.forEach(function (n) { if (folders.indexOf(n.folder) < 0) folders.push(n.folder); });
  var fcol = {}; folders.forEach(function (f, i) { fcol[f] = PALETTE[i % PALETTE.length]; });
  var hidden = {};
  var byId = {};
  D.nodes.forEach(function (n) { byId[n.id] = n; n.nb = []; n.deg = 0; });
  var E = [];
  D.links.forEach(function (l) {
    var a = byId[l.s], b = byId[l.t];
    if (a && b && a !== b) { a.nb.push(b); b.nb.push(a); a.deg++; b.deg++; E.push([a, b]); }
  });
  var orphans = D.nodes.filter(function (n) { return n.deg === 0; });
  var missing = D.nodes.filter(function (n) { return n.missing > 0; }).sort(function (a, b) { return b.missing - a.missing; });
  var totalMissing = missing.reduce(function (s, n) { return s + n.missing; }, 0);

  document.title = D.title;
  document.getElementById('title').textContent = D.title;
  document.getElementById('sub').textContent = 'Map of the notes and their links. Generated on ' + D.date + '.';
  function chip(txt, warn) { var s = document.createElement('span'); s.className = 'chip' + (warn ? ' warn' : ''); s.textContent = txt; return s; }
  var st = document.getElementById('stats');
  st.appendChild(chip(D.nodes.length + ' notes'));
  st.appendChild(chip(E.length + ' links'));
  st.appendChild(chip(totalMissing + ' to complete' + (missing.length ? ' in ' + missing.length + ' notes' : ''), totalMissing > 0));
  st.appendChild(chip(orphans.length + ' with no link', orphans.length > 0));

  var legend = document.getElementById('legend');
  folders.forEach(function (f) {
    var lab = document.createElement('label');
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
    cb.addEventListener('change', function () { hidden[f] = !cb.checked; draw(); });
    var dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = fcol[f];
    var t = document.createElement('span');
    t.textContent = f + ' (' + D.nodes.filter(function (n) { return n.folder === f; }).length + ')';
    lab.appendChild(cb); lab.appendChild(dot); lab.appendChild(t); legend.appendChild(lab);
  });

  function noteBtn(n, extra) {
    var b = document.createElement('button'); b.className = 'note'; b.type = 'button';
    b.textContent = n.label; if (extra) { var s = document.createElement('small'); s.textContent = ' ' + extra; b.appendChild(s); }
    b.addEventListener('click', function () { select(n, true); });
    return b;
  }
  var watch = document.getElementById('watch');
  function block(title, items, fn) {
    var p = document.createElement('p'); p.className = 'muted'; p.style.margin = '8px 0 2px'; p.textContent = title; watch.appendChild(p);
    if (!items.length) { var o = document.createElement('p'); o.textContent = 'Nothing to report.'; watch.appendChild(o); return; }
    items.forEach(function (n) { watch.appendChild(fn(n)); });
  }
  block('Notes to complete', missing.slice(0, 8), function (n) { return noteBtn(n, n.missing + ' to complete'); });
  block('Notes with no link', orphans.slice(0, 8), function (n) { return noteBtn(n, n.folder); });
  var all = document.getElementById('all');
  D.nodes.slice().sort(function (a, b) { return (a.folder + a.label).localeCompare(b.folder + b.label, 'en'); })
    .forEach(function (n) { all.appendChild(noteBtn(n, n.folder)); });

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), stage = document.getElementById('stage'), tip = document.getElementById('tip');
  var W = 0, H = 0, dpr = Math.max(1, window.devicePixelRatio || 1);
  var view = { k: 1, x: 0, y: 0 };
  var sel = null, hover = null, query = '', alpha = 1, drag = null, pan = null, moved = false;

  folders.forEach(function (f, i) {
    var ang = (i / Math.max(1, folders.length)) * Math.PI * 2;
    D.nodes.filter(function (n) { return n.folder === f; }).forEach(function (n) {
      n.x = Math.cos(ang) * 160 + (Math.random() - .5) * 70; n.y = Math.sin(ang) * 160 + (Math.random() - .5) * 70; n.vx = 0; n.vy = 0;
    });
  });
  D.nodes.forEach(function (n) { n.r = 6 + Math.min(14, Math.sqrt(n.deg) * 3.2); });

  function resize() {
    W = stage.clientWidth; H = stage.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    if (!view.set) { view.x = W / 2; view.y = H / 2; view.set = true; }
    draw();
  }
  function norm(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function visible(n) { return !hidden[n.folder]; }
  function matches(n) { return !query || norm(n.label + ' ' + n.id).indexOf(query) >= 0; }

  function tick() {
    var N = D.nodes, i, j, a, b, dx, dy, d2, d, f;
    for (i = 0; i < N.length; i++) {
      a = N[i];
      for (j = i + 1; j < N.length; j++) {
        b = N[j]; dx = a.x - b.x; dy = a.y - b.y; d2 = dx * dx + dy * dy + 0.01;
        if (d2 > 90000) continue;
        f = 5200 / d2; d = Math.sqrt(d2); dx = dx / d * f; dy = dy / d * f;
        a.vx += dx; a.vy += dy; b.vx -= dx; b.vy -= dy;
      }
    }
    E.forEach(function (e) {
      var p = e[0], q = e[1]; dx = q.x - p.x; dy = q.y - p.y; d = Math.sqrt(dx * dx + dy * dy) + 0.01;
      f = (d - 110) * 0.02; dx = dx / d * f; dy = dy / d * f; p.vx += dx; p.vy += dy; q.vx -= dx; q.vy -= dy;
    });
    N.forEach(function (n) {
      n.vx -= n.x * 0.004; n.vy -= n.y * 0.004;
      if (n === drag) { n.vx = 0; n.vy = 0; return; }
      n.x += n.vx * alpha; n.y += n.vy * alpha; n.vx *= 0.82; n.vy *= 0.82;
    });
    alpha *= 0.985;
  }
  var fitted = false;
  function fit() {
    var vis = D.nodes.filter(visible); if (!vis.length) return;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    vis.forEach(function (n) { x0 = Math.min(x0, n.x - n.r); y0 = Math.min(y0, n.y - n.r); x1 = Math.max(x1, n.x + n.r); y1 = Math.max(y1, n.y + n.r + 18); });
    var pad = 50, k = Math.min((W - pad * 2) / Math.max(1, x1 - x0), (H - pad * 2) / Math.max(1, y1 - y0), 1.6);
    view.k = k; view.x = W / 2 - ((x0 + x1) / 2) * k; view.y = H / 2 - ((y0 + y1) / 2) * k; draw();
  }
  function loop() {
    if (alpha > 0.02) { tick(); draw(); }
    else if (!fitted) { fit(); fitted = true; }
    requestAnimationFrame(loop);
  }

  function active(n) { return !sel || n === sel || sel.nb.indexOf(n) >= 0; }
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.translate(view.x, view.y); ctx.scale(view.k, view.k);
    var edge = css('--edge'), edgeHi = css('--edge-hi'), warn = css('--warn'), muted = css('--muted'), ink = css('--ink');
    E.forEach(function (e) {
      if (!visible(e[0]) || !visible(e[1])) return;
      var hi = sel && (e[0] === sel || e[1] === sel);
      ctx.strokeStyle = hi ? edgeHi : edge; ctx.globalAlpha = (!sel || hi) ? 1 : 0.12; ctx.lineWidth = (hi ? 2 : 1) / view.k;
      ctx.beginPath(); ctx.moveTo(e[0].x, e[0].y); ctx.lineTo(e[1].x, e[1].y); ctx.stroke();
    });
    var labelAll = D.nodes.length <= 60;
    D.nodes.forEach(function (n) {
      if (!visible(n)) return;
      var on = active(n) && matches(n);
      ctx.globalAlpha = on ? 1 : 0.14;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fillStyle = fcol[n.folder]; ctx.fill();
      if (n.missing > 0) { ctx.lineWidth = 3 / view.k; ctx.strokeStyle = warn; ctx.setLineDash([]); ctx.stroke(); }
      else if (n.deg === 0) { ctx.lineWidth = 2 / view.k; ctx.strokeStyle = muted; ctx.setLineDash([4 / view.k, 3 / view.k]); ctx.stroke(); ctx.setLineDash([]); }
      if (n === sel) { ctx.lineWidth = 2.5 / view.k; ctx.strokeStyle = ink; ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 4 / view.k, 0, Math.PI * 2); ctx.stroke(); }
      if (on && (labelAll || n.deg >= 3 || n === sel || n === hover || (sel && active(n)))) {
        ctx.fillStyle = ink; ctx.font = (12 / view.k) + 'px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(n.label, n.x, n.y + n.r + 14 / view.k);
      }
    });
    ctx.globalAlpha = 1;
  }

  function toWorld(px, py) { return { x: (px - view.x) / view.k, y: (py - view.y) / view.k }; }
  function pick(px, py) {
    var w = toWorld(px, py), best = null, bd = 1e9;
    D.nodes.forEach(function (n) {
      if (!visible(n)) return;
      var dx = n.x - w.x, dy = n.y - w.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d <= n.r + 4 / view.k && d < bd) { best = n; bd = d; }
    });
    return best;
  }
  function pos(ev) { var r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }

  cv.addEventListener('pointerdown', function (ev) {
    var p = pos(ev), n = pick(p.x, p.y); moved = false; cv.setPointerCapture(ev.pointerId);
    if (n) { drag = n; } else { pan = { x: p.x, y: p.y, vx: view.x, vy: view.y }; cv.classList.add('drag'); }
  });
  cv.addEventListener('pointermove', function (ev) {
    var p = pos(ev);
    if (drag) { var w = toWorld(p.x, p.y); drag.x = w.x; drag.y = w.y; moved = true; alpha = Math.max(alpha, 0.3); draw(); return; }
    if (pan) { view.x = pan.vx + (p.x - pan.x); view.y = pan.vy + (p.y - pan.y); moved = true; draw(); return; }
    var n = pick(p.x, p.y);
    if (n !== hover) { hover = n; draw(); }
    if (n) { tip.style.display = 'block'; tip.style.left = (p.x + 14) + 'px'; tip.style.top = (p.y + 14) + 'px'; tip.textContent = n.label + ' (' + n.folder + ')'; }
    else { tip.style.display = 'none'; }
  });
  cv.addEventListener('pointerup', function (ev) {
    var p = pos(ev), n = pick(p.x, p.y);
    if (!moved) { select(n || null, false); }
    drag = null; pan = null; cv.classList.remove('drag');
  });
  cv.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var p = pos(ev), w = toWorld(p.x, p.y), k = Math.min(4, Math.max(0.2, view.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
    view.k = k; view.x = p.x - w.x * k; view.y = p.y - w.y * k; draw();
  }, { passive: false });

  function select(n, center) {
    sel = n;
    if (n && center) { view.x = W / 2 - n.x * view.k; view.y = H / 2 - n.y * view.k; }
    var box = document.getElementById('info'); box.innerHTML = '';
    if (!n) { var p0 = document.createElement('p'); p0.className = 'muted'; p0.textContent = 'Click a point to see the note and its links.'; box.appendChild(p0); draw(); return; }
    function line(txt, cls) { var p = document.createElement('p'); if (cls) p.className = cls; p.textContent = txt; box.appendChild(p); }
    var h = document.createElement('p'); h.style.fontWeight = '600'; h.textContent = n.label; box.appendChild(h);
    line(n.path, 'muted');
    if (n.desc) line(n.desc);
    line('Folder: ' + n.folder + (n.updated ? '. Updated: ' + n.updated + '.' : '.'), 'muted');
    if (n.missing > 0) line(n.missing + ' item(s) to complete in this note.');
    if (n.deg === 0) line('This note is not linked to any other note.');
    else {
      line('Linked to ' + n.nb.length + ' note(s):', 'muted');
      n.nb.forEach(function (m) { box.appendChild(noteBtn(m, m.folder)); });
    }
    draw();
  }
  document.getElementById('q').addEventListener('input', function (ev) { query = norm(ev.target.value.trim()); draw(); });
  document.getElementById('q').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { var m = D.nodes.filter(function (n) { return visible(n) && matches(n); })[0]; if (m) select(m, true); }
  });
  document.getElementById('recenter').addEventListener('click', function () { select(null, false); fit(); });
  window.addEventListener('resize', function () { resize(); if (fitted) fit(); });
  resize(); loop();
})();
</script>
</body>
</html>
