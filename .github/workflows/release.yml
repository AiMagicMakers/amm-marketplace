name: Release plugin ZIP

# Publishes a ZIP of the plugin (plugin root at the top level of the ZIP) when a version tag is pushed.
# Example: git tag v2.0.0 && git push origin v2.0.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          PLUGIN_VERSION=$(python3 -c "import json;print(json.load(open('plugins/amm-os-starter/.claude-plugin/plugin.json'))['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "plugin.json version: $PLUGIN_VERSION, tag: $TAG_VERSION"
          if [ "$PLUGIN_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $PLUGIN_VERSION" >&2
            exit 1
          fi

      - name: Build the plugin ZIP
        run: |
          cd plugins/amm-os-starter
          zip -r "../../amm-os-starter-${GITHUB_REF_NAME}.zip" . -x '*.DS_Store' -x '*__pycache__*'
          cd ../..
          unzip -Z1 "amm-os-starter-${GITHUB_REF_NAME}.zip" | grep -E '^\.claude-plugin/plugin\.json$'
          unzip -Z1 "amm-os-starter-${GITHUB_REF_NAME}.zip" | grep -E '^skills/amm-os-starter/SKILL\.md$'

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "amm-os-starter-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "Plugin ZIP for manual upload. Most people should install from the marketplace instead: see the README."
